# paraphrases — посевные формулировки для эмбеддингов/TF-IDF.
#   НЕ использовать как тестовый набор: тест пишут люди отдельно.
# answer — TODO: заполнить текстами с сайта или от команды фонда.
#   Ничего не выдумывать, особенно в темах с priority: critical.
